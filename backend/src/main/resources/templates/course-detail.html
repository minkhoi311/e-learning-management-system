<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Cập nhật Khóa học</title>
        <th:block th:replace="~{base :: css}"></th:block>
    </head>
    <body class="bg-light">
        <div th:replace="~{base :: header}"></div>

        <section class="container mt-4 mb-5">
            <div class="row justify-content-center">
                <div class="col-md-10 bg-white p-4 shadow-sm rounded"> <h2 class="text-center text-primary mb-4" th:text="${course.id == null ? 'THÊM KHÓA HỌC MỚI' : 'CẬP NHẬT KHÓA HỌC'}">THÔNG TIN KHÓA HỌC</h2>

                    <form method="post" th:object="${course}" th:action="@{/admin/courses/add}" enctype="multipart/form-data">

                        <div class="mb-3">
                            <label for="subject" class="form-label fw-bold">Tên khóa học: <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="subject" placeholder="Nhập tên khóa học" th:field="*{subject}" required />
                        </div>

                        <div class="row">
                            <div class="col-md-3 mb-3">
                                <label for="price" class="form-label fw-bold">Học phí (VNĐ): </label>
                                <input type="number" class="form-control" id="price" placeholder="Nhập học phí" th:field="*{price}" />
                            </div>

                            <div class="col-md-3 mb-3">
                                <label for="duration" class="form-label fw-bold">Thời lượng (Giờ): </label>
                                <input type="number" step="0.5" class="form-control" id="duration" placeholder="VD: 20.5" th:field="*{durationHours}" />
                            </div>

                            <div class="col-md-3 mb-3">
                                <label for="cate" class="form-label fw-bold">Danh mục: <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{categoryId}" id="cate" required>
                                    <option value="">-- Chọn danh mục --</option>
                                    <option th:each="c: ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                                </select>
                            </div>

                            <div class="col-md-3 mb-3">
                                <label for="instructor" class="form-label fw-bold">Giảng viên: <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{instructorId}" id="instructor" required> 
                                    <option value="">-- Chọn giảng viên --</option>
                                    <option th:each="u: ${instructors}" th:value="${u.id}" th:text="${u.lastName + ' ' + u.firstName}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label fw-bold">Mô tả khóa học: </label>
                            <textarea class="form-control" id="description" rows="4" placeholder="Nhập mô tả chi tiết" th:field="*{description}"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label for="file" class="form-label fw-bold">Upload ảnh minh họa: </label>
                                <input type="file" class="form-control" id="file" th:field="*{file}" />
                            </div>

                            <div class="col-md-4 mb-3 d-flex flex-column justify-content-center">
                                <label class="form-label fw-bold">Trạng thái khóa học: </label>
                                <div class="form-check form-switch fs-5">
                                    <input class="form-check-input" type="checkbox" id="isActive" th:field="*{isActive}">
                                    <label class="form-check-label fs-6 text-success mt-1" for="isActive">Đang hoạt động</label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4 p-2 border rounded text-center bg-light" th:if="${course.image != null and !course.image.isEmpty()}">
                            <label class="form-label text-muted small d-block">Ảnh hiện tại</label>
                            <img th:src="${course.image}" class="img-thumbnail" style="max-height: 150px; object-fit: contain;" />
                        </div>

                        <hr class="text-muted">

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/admin/courses}" class="btn btn-secondary">Hủy bỏ</a>
                            <button th:if="${course.id == null}" class="btn btn-success">Thêm khóa học</button>
                            <button th:unless="${course.id == null}" class="btn btn-primary">Lưu thay đổi</button>
                        </div>

                        <input type="hidden" th:field="*{id}" />
                        <input type="hidden" th:field="*{image}" />
                    </form>

                </div>
            </div>
        </section>

        <div th:replace="~{base :: footer}"></div>
    </body>
</html>
