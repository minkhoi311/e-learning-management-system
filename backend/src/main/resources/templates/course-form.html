<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${pageTitle}">Khóa học</title>
    <th:block th:replace="~{base :: css}"></th:block>
    <style>
        .form-card { max-width: 750px; margin: 0 auto; }
        .required-mark { color: #dc3545; }
        .invalid-feedback { display: block; }
    </style>
</head>
<body>
    <div th:replace="~{base :: header}"></div>

    <div class="container mt-4">
        <div class="form-card">

            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin/courses}">Khóa học</a></li>
                    <li class="breadcrumb-item active" th:text="${pageTitle}"></li>
                </ol>
            </nav>

            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0" th:text="${pageTitle}"></h5>
                </div>
                <div class="card-body">

                    <!--
                        action="/admin/courses/save" dùng cho cả thêm mới lẫn cập nhật.
                        Controller phân biệt qua course.id: nếu id=0 hoặc null → thêm mới.
                    -->
                    <form th:action="@{/admin/courses/save}" method="post">

                        <!-- Hidden field ID (để controller biết đây là update) -->
                        <input type="hidden" th:field="*{course.id}" />

                        <!-- ===== TÊN KHÓA HỌC ===== -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Tên khóa học <span class="required-mark">*</span>
                            </label>
                            <input type="text" name="subject" class="form-control"
                                   th:value="${course.subject}"
                                   th:classappend="${errors != null and errors['subject'] != null} ? 'is-invalid'"
                                   placeholder="VD: Python & Data Analysis toàn tập"
                                   maxlength="255" />
                            <div class="invalid-feedback" th:if="${errors != null and errors['subject'] != null}"
                                 th:text="${errors['subject']}"></div>
                        </div>

                        <!-- ===== MÔ TẢ ===== -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mô tả</label>
                            <textarea name="description" class="form-control" rows="3"
                                      placeholder="Mô tả ngắn về nội dung khóa học..."
                                      th:text="${course.description}"></textarea>
                        </div>

                        <!-- ===== HÀNG 2: DANH MỤC + GIẢNG VIÊN ===== -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Danh mục</label>
                                <select name="category" class="form-select">
                                    <option value="">-- Chọn danh mục --</option>
                                    <option th:each="c : ${categories}"
                                            th:value="${c.id}"
                                            th:text="${c.name}"
                                            th:selected="${course.category != null and course.category.id == c.id}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">
                                    Giảng viên <span class="required-mark">*</span>
                                </label>
                                <select name="instructor" class="form-select"
                                        th:classappend="${errors != null and errors['instructor'] != null} ? 'is-invalid'">
                                    <option value="">-- Chọn giảng viên --</option>
                                    <option th:each="u : ${instructors}"
                                            th:value="${u.id}"
                                            th:text="${u.lastName + ' ' + u.firstName}"
                                            th:selected="${course.instructor != null and course.instructor.id == u.id}">
                                    </option>
                                </select>
                                <div class="invalid-feedback" th:if="${errors != null and errors['instructor'] != null}"
                                     th:text="${errors['instructor']}"></div>
                            </div>
                        </div>

                        <!-- ===== HÀNG 3: HỌC PHÍ + THỜI LƯỢNG ===== -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">
                                    Học phí (VNĐ) <span class="required-mark">*</span>
                                    <small class="text-muted fw-normal">— nhập 0 nếu miễn phí</small>
                                </label>
                                <input type="number" name="price" class="form-control"
                                       th:value="${course.price != null ? course.price : 0}"
                                       th:classappend="${errors != null and errors['price'] != null} ? 'is-invalid'"
                                       min="0" step="1000" placeholder="0" />
                                <div class="invalid-feedback" th:if="${errors != null and errors['price'] != null}"
                                     th:text="${errors['price']}"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Thời lượng (giờ)</label>
                                <input type="number" name="durationHours" class="form-control"
                                       th:value="${course.durationHours}"
                                       th:classappend="${errors != null and errors['durationHours'] != null} ? 'is-invalid'"
                                       min="0.5" step="0.5" placeholder="VD: 20.5" />
                                <div class="invalid-feedback" th:if="${errors != null and errors['durationHours'] != null}"
                                     th:text="${errors['durationHours']}"></div>
                            </div>
                        </div>

                        <!-- ===== ẢNH ===== -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Đường dẫn ảnh</label>
                            <input type="text" name="image" class="form-control"
                                   th:value="${course.image}"
                                   placeholder="VD: python_course.jpg hoặc URL đầy đủ" />
                            <!-- Preview ảnh nếu đã có -->
                            <div th:if="${course.image != null and !course.image.isBlank()}" class="mt-2">
                                <img th:src="${course.image}" alt="Preview"
                                     style="max-height: 120px; border-radius:6px; border:1px solid #ddd;" />
                            </div>
                        </div>

                        <!-- ===== TRẠNG THÁI ===== -->
                        <div class="mb-4">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="isActive"
                                       id="isActiveSwitch" value="true"
                                       th:checked="${course.isActive == null or course.isActive}" />
                                <label class="form-check-label fw-semibold" for="isActiveSwitch">
                                    Đang mở (hiển thị cho sinh viên)
                                </label>
                            </div>
                        </div>

                        <!-- ===== NÚT HÀNH ĐỘNG ===== -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4">
                                💾 Lưu khóa học
                            </button>
                            <a th:href="@{/admin/courses}" class="btn btn-outline-secondary px-4">
                                Hủy
                            </a>
                        </div>

                    </form>

                </div><!-- /card-body -->
            </div><!-- /card -->

        </div><!-- /form-card -->
    </div><!-- /container -->

    <div th:replace="~{base :: footer}"></div>
</body>
</html>
