<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Quản lý Khóa học</title>
    <th:block th:replace="~{base :: css}"></th:block>
</head>
<body class="bg-light">
    <div th:replace="~{base :: header}"></div>

    <section class="container mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary"><i class="bi bi-journal-richtext"></i> DANH SÁCH KHÓA HỌC</h2>
            <a th:href="@{/admin/courses/add}" class="btn btn-success"><i class="bi bi-plus-circle"></i> Thêm khóa học mới</a>
        </div>

        <div class="card p-3 mb-4 shadow-sm border-0">
            <form action="" method="get" class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label text-muted small fw-bold">Tên khóa học</label>
                    <input type="text" class="form-control" name="kw" placeholder="Nhập từ khóa..." th:value="${param.kw}">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small fw-bold">Danh mục</label>
                    <select class="form-select" name="cateId">
                        <option value="">-- Tất cả danh mục --</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${param.cateId != null and param.cateId.toString() == c.id.toString()}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted small fw-bold">Giá từ (VNĐ)</label>
                    <input type="number" class="form-control" name="fromPrice" placeholder="VD: 500000" th:value="${param.fromPrice}">
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted small fw-bold">Đến giá (VNĐ)</label>
                    <input type="number" class="form-control" name="toPrice" placeholder="VD: 2000000" th:value="${param.toPrice}">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i> Lọc dữ liệu</button>
                </div>
            </form>
        </div>

        <div class="bg-white shadow-sm rounded overflow-hidden">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="text-center" width="5%">ID</th>
                        <th class="text-center" width="15%">Ảnh</th>
                        <th width="35%">Tên khóa học</th>
                        <th width="20%">Học phí</th>
                        <th class="text-center" width="25%">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${courses.isEmpty()}">
                        <td colspan="5" class="text-center text-muted py-4">Không tìm thấy khóa học nào phù hợp!</td>
                    </tr>
                    <tr th:each="c: ${courses}">
                        <td class="text-center fw-bold text-secondary" th:text="${c.id}"></td>

                        <td class="text-center">
                            <img th:if="${c.image != null and !c.image.isEmpty()}" th:src="${c.image}" style="width: 90px; height: 60px; object-fit: cover;" class="rounded border shadow-sm" alt="Hình ảnh khóa học" />
                            <span th:unless="${c.image != null and !c.image.isEmpty()}" class="badge bg-light text-dark border">No Image</span>
                        </td>

                        <td class="fw-bold text-primary" th:text="${c.subject}"></td>
                        <td class="fw-bold text-success" th:text="${c.price != null ? #numbers.formatDecimal(c.price, 0, 'COMMA', 0, 'POINT') + ' đ' : 'Miễn phí'}"></td>

                        <td class="text-center">
                            <a th:href="@{/admin/courses/} + ${c.id}" class="btn btn-sm btn-outline-info me-1"><i class="bi bi-pencil-square"></i> Cập nhật</a>
                            
                            <button class="btn btn-sm btn-outline-danger" 
                                    th:onclick="'deleteCourse(\'' + @{/api/courses/} + ${c.id} + '\', this)'">
                                <i class="bi bi-trash"></i> Xóa
                            </button>
                            
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <nav aria-label="Page navigation" th:if="${totalPages > 1}" class="mt-4">
            <ul class="pagination justify-content-center">

                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/courses(page=${currentPage - 1}, kw=${param.kw}, cateId=${param.cateId}, fromPrice=${param.fromPrice}, toPrice=${param.toPrice})}">« Trước</a>
                </li>

                <li class="page-item" 
                    th:each="i : ${#numbers.sequence(1, totalPages)}" 
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/admin/courses(page=${i}, kw=${param.kw}, cateId=${param.cateId}, fromPrice=${param.fromPrice}, toPrice=${param.toPrice})}" th:text="${i}"></a>
                </li>

                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/courses(page=${currentPage + 1}, kw=${param.kw}, cateId=${param.cateId}, fromPrice=${param.fromPrice}, toPrice=${param.toPrice})}">Sau »</a>
                </li>

            </ul>
        </nav>
    </section>

    <div th:replace="~{base :: footer}"></div>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
