<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Quản lý Khóa học</title>
    <th:block th:replace="base :: css"></th:block>
</head>
<body>
    <div th:replace="base :: header"></div>

    <section class="container">
        <h1 class="text-center text-info mt-3">DANH SÁCH KHÓA HỌC</h1>

        <div class="mt-2 mb-3">
            <a th:href="@{/admin/courses/add}" class="btn btn-info">Thêm khóa học</a>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Ảnh</th>
                    <th>Tên khóa học</th>
                    <th>Học phí</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c: ${courses}">
                    <td>
                        <img th:src="${c.image}" width="200" alt="Hình ảnh khóa học" />
                    </td>
                    <td th:text="${c.subject}"></td>
                    <td th:text="${c.price} + ' VNĐ'"></td>
                    <td>
                        <a th:href="@{/admin/courses/} + ${c.id}" class="btn btn-info">Cập nhật</a>
                        <button class="btn btn-danger" th:onclick="'deleteCourse(\'' + @{/api/courses/} + ${c.id} + '\')'">Xóa</button>
                    </td>
                </tr>
            </tbody>
        </table>


        <nav aria-label="Page navigation" th:if="${totalPages > 1}" class="mt-4">
            <ul class="pagination justify-content-center">

                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/courses(page=${currentPage - 1})}">Trước</a>
                </li>

                <li class="page-item" 
                    th:each="i : ${#numbers.sequence(1, totalPages)}" 
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/admin/courses(page=${i})}" th:text="${i}">1</a>
                </li>

                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/courses(page=${currentPage + 1})}">Sau</a>
                </li>

            </ul>
        </nav>
    </section>

    <div th:replace="base :: footer"></div>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
