<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Trang chủ - Hệ thống E-Learning</title>
    <th:block th:replace="~{base :: css}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <div th:replace="~{base :: header}"></div>
    <div class="container mt-5">
        <div class="p-5 bg-white shadow-sm text-center" style="border-radius: 20px; border: none;">
            
            <div class="mb-4">
                <th:block th:if="${currentUser != null and currentUser.avatar != null and !currentUser.avatar.isEmpty()}">
                    <img th:src="${currentUser.avatar}" class="rounded-circle shadow" 
                         style="width: 120px; height: 120px; object-fit: cover; border: 4px solid #FF6B4A;">
                </th:block>
                
                <th:block th:unless="${currentUser != null and currentUser.avatar != null and !currentUser.avatar.isEmpty()}">
                    <div class="shadow" style="width: 120px; height: 120px; background: #eee; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #aaa; border: 4px solid #FF6B4A;">
                        <i class="fa fa-user"></i>
                    </div>
                </th:block>
            </div>

            <h1 class="display-4 fw-bold" style="color: #333;">
                Xin chào, <span th:text="${currentUser != null ? currentUser.firstName : 'Khách'}"></span>!
            </h1>

            <p class="lead text-muted text-uppercase mt-2" style="letter-spacing: 1px;">QUẢN TRỊ VIÊN HỆ THỐNG
            </p>

            <hr class="my-4 mx-auto" style="width: 100px; border-top: 3px solid #FF6B4A; opacity: 1;">

            <p class="text-muted mb-5">Chào mừng bạn quay trở lại hệ thống E-Learning.</p>

        </div>
    </div>

    <div th:replace="~{base :: footer}"></div>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
