<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Cập nhật Bài học</title>
        <th:block th:replace="~{base :: css}"></th:block>
    </head>
    <body class="bg-light">
        <div th:replace="~{base :: header}"></div>

        <section class="container mt-4 mb-5">
            <div class="row justify-content-center">
                <div class="col-md-10 bg-white p-4 shadow-sm rounded"> 
                    
                    <h2 class="text-center text-primary mb-4" th:text="${lesson.id == null ? 'THÊM BÀI HỌC MỚI' : 'CẬP NHẬT BÀI HỌC'}">THÔNG TIN BÀI HỌC</h2>

                    <form method="post" th:object="${lesson}" th:action="@{/admin/lessons/add}" enctype="multipart/form-data">

                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label for="subject" class="form-label fw-bold">Tên bài học: <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="subject" placeholder="VD: Bài 1 - Giới thiệu tổng quan..." th:field="*{subject}" required />
                            </div>

                            <div class="col-md-4 mb-3">
                                <label for="course" class="form-label fw-bold">Thuộc khóa học: <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{courseId}" id="course" required>
                                    <option value="">-- Chọn khóa học --</option>
                                    <option th:each="c: ${courses}" th:value="${c.id}" th:text="${c.subject}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="content" class="form-label fw-bold">Nội dung bài học: </label>
                            <textarea class="form-control" id="content" rows="6" placeholder="Nhập nội dung văn bản, mô tả hoặc link video cho bài học này..." th:field="*{content}"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label for="file" class="form-label fw-bold">Upload ảnh Thumbnail: </label>
                                <input type="file" class="form-control" id="file" th:field="*{file}" />
                            </div>

                            <div class="col-md-4 mb-3 d-flex flex-column justify-content-center">
                                <label class="form-label fw-bold">Trạng thái bài học: </label>
                                <div class="form-check form-switch fs-5">
                                    <input class="form-check-input" type="checkbox" id="isActive" th:field="*{isActive}">
                                    <label class="form-check-label fs-6 text-success mt-1" for="isActive">Cho phép hiển thị</label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4 p-2 border rounded text-center bg-light" th:if="${lesson.image != null and !lesson.image.isEmpty()}">
                            <label class="form-label text-muted small d-block">Ảnh hiện tại</label>
                            <img th:src="${lesson.image}" class="img-thumbnail" style="max-height: 150px; object-fit: contain;" />
                        </div>

                        <hr class="text-muted">

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/admin/lessons}" class="btn btn-secondary">Hủy bỏ</a>
                            <button th:if="${lesson.id == null}" class="btn btn-success">Thêm bài học</button>
                            <button th:unless="${lesson.id == null}" class="btn btn-primary">Lưu thay đổi</button>
                        </div>

                        <input type="hidden" th:field="*{id}" />
                        <input type="hidden" th:field="*{image}" />
                    </form>

                </div>
            </div>
        </section>

        <div th:replace="~{base :: footer}"></div>
    </body>
</html>
