<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Quản lý Bài học</title>
    <th:block th:replace="~{base :: css}"></th:block>
</head>
<body class="bg-light">
    <div th:replace="~{base :: header}"></div>

    <section class="container mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary"><i class="bi bi-file-earmark-play"></i> QUẢN LÝ BÀI HỌC</h2>
            <a th:href="@{/admin/lessons/add}" class="btn btn-success"><i class="bi bi-plus-circle"></i> Thêm Bài Học Mới</a>
        </div>

        <div class="card p-3 mb-4 shadow-sm border-0">
            <form action="" method="get" class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label text-muted small fw-bold">Tên bài học</label>
                    <input type="text" class="form-control" name="kw" placeholder="Nhập từ khóa..." th:value="${param.kw}">
                </div>
                <div class="col-md-4">
                    <label class="form-label text-muted small fw-bold">Thuộc khóa học</label>
                    <select class="form-select" name="courseId">
                        <option value="">-- Tất cả khóa học --</option>
                        <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.subject}" th:selected="${param.courseId != null and param.courseId.toString() == c.id.toString()}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted small fw-bold">Trạng thái</label>
                    <select class="form-select" name="isActive">
                        <option value="">-- Tất cả --</option>
                        <option value="true" th:selected="${param.isActive != null and param.isActive.toString() == 'true'}">Active</option>
                        <option value="false" th:selected="${param.isActive != null and param.isActive.toString() == 'false'}">Hidden</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i> Lọc dữ liệu</button>
                </div>
            </form>
        </div>

        <div class="bg-white shadow-sm rounded overflow-hidden">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="text-center" width="5%">ID</th>
                        <th class="text-center" width="10%">Ảnh</th>
                        <th width="35%">Tên bài học</th>
                        <th width="25%">Thuộc Khóa</th>
                        <th class="text-center" width="10%">Trạng thái</th>
                        <th class="text-center" width="15%">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${lessons.isEmpty()}">
                        <td colspan="6" class="text-center text-muted py-4">Không tìm thấy bài học nào phù hợp!</td>
                    </tr>
                    <tr th:each="l : ${lessons}">
                        <td class="text-center fw-bold text-secondary" th:text="${l.id}"></td>
                        <td class="text-center">
                            <img th:if="${l.image != null and !l.image.isEmpty()}" th:src="${l.image}" style="width: 60px; height: 40px; object-fit: cover;" class="rounded border" alt="Thumb">
                            <span th:unless="${l.image != null and !l.image.isEmpty()}" class="badge bg-light text-dark border">No Image</span>
                        </td>
                        <td class="fw-bold" th:text="${l.subject}"></td>

                        <td th:text="${l.courseId != null ? l.courseId.subject : 'N/A'}"></td>

                        <td class="text-center">
                            <span class="badge bg-success" th:if="${l.isActive}">Active</span>
                            <span class="badge bg-danger" th:unless="${l.isActive}">Hidden</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/admin/lessons/{id}(id=${l.id})}" class="btn btn-sm btn-outline-info me-1">
                                <i class="bi bi-pencil-square"></i> Sửa
                            </a>

                            <a th:href="@{/admin/lessons/delete/{id}(id=${l.id})}" 
                               class="btn btn-sm btn-outline-danger" 
                               onclick="return confirm('Bạn có chắc chắn muốn xóa bài học này không? Hành động này không thể hoàn tác!');">
                                <i class="bi bi-trash"></i> Xóa
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <nav th:if="${totalPages > 1}" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/lessons(page=${currentPage - 1}, kw=${param.kw}, courseId=${param.courseId}, isActive=${param.isActive})}">« Trước</a>
                </li>

                <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/admin/lessons(page=${i}, kw=${param.kw}, courseId=${param.courseId}, isActive=${param.isActive})}" th:text="${i}"></a>
                </li>

                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/lessons(page=${currentPage + 1}, kw=${param.kw}, courseId=${param.courseId}, isActive=${param.isActive})}">Sau »</a>
                </li>
            </ul>
        </nav>

    </section>

    <div th:replace="~{base :: footer}"></div>
</body>
</html>
