<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

    <head th:replace="~{base :: css}"></head>

    <body class="bg-light">
        <div th:replace="~{base :: header}"></div>

        <div class="container mt-4 mb-5">
            <h3 class="text-primary mb-4"><i class="bi bi-bar-chart-fill"></i> Thống kê tổng quan</h3>

            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="card text-center p-3 shadow-sm border-0 border-start border-primary border-4">
                        <h6 class="text-muted">Tổng khóa học</h6>
                        <h3 class="fw-bold text-dark" th:text="${stats.totalCourses}">0</h3>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center p-3 shadow-sm border-0 border-start border-success border-4">
                        <h6 class="text-muted">Tổng đăng ký</h6>
                        <h3 class="fw-bold text-dark" th:text="${stats.totalEnrollments}">0</h3>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center p-3 shadow-sm border-0 border-start border-warning border-4">
                        <h6 class="text-muted">Tổng Doanh thu</h6>
                        <h3 class="fw-bold text-dark" th:text="${stats.totalRevenue != null ? #numbers.formatDecimal(stats.totalRevenue, 0, 'COMMA', 0, 'POINT') + ' đ' : '0 đ'}">0 đ</h3>
                    </div>
                </div>
            </div>

            <div class="card p-4 mb-4 shadow-sm border-0">
                <div class="d-flex align-items-center gap-3 mb-3">
                    <h5 class="mb-0 text-secondary"><i class="bi bi-graph-up"></i> Doanh thu theo tháng</h5>
                    <select id="yearSelect" class="form-select w-auto fw-bold"
                            th:onchange="'loadMonthlyRevenue(this.value, \'' + @{/api/stats/monthly} + '\')'">
                        <option value="2023">Năm 2023</option>
                        <option value="2024">Năm 2024</option>
                        <option value="2025">Năm 2025</option>
                        <option value="2026" selected>Năm 2026</option>
                    </select>
                </div>

                <div style="position: relative; height:40vh; width:100%">
                    <canvas id="revenueChart"></canvas>
                </div>
            </div>
        </div>

        <div th:replace="~{base :: footer}"></div>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script th:src="@{/js/script.js}"></script>



    </body>
</html>
