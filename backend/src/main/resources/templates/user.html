<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Quản lý Người dùng</title>
    <th:block th:replace="~{base :: css}"></th:block>
</head>
<body class="bg-light">
    <div th:replace="~{base :: header}"></div>

    <section class="container mt-4 mb-5">
        <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errMsg}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary"><i class="bi bi-people"></i> QUẢN LÝ NGƯỜI DÙNG</h2>
            <a th:href="@{/admin/users/add}" class="btn btn-success"><i class="bi bi-person-plus-fill"></i> Thêm người dùng</a>
        </div>

        <div class="card p-3 mb-4 shadow-sm border-0">
            <form action="" method="get" class="row g-2 align-items-end">
                <div class="col-md-6">
                    <label class="form-label text-muted small fw-bold">Tìm kiếm (Tên, Email, Username)</label>
                    <input type="text" class="form-control" name="kw" placeholder="Nhập từ khóa..." th:value="${param.kw}">
                </div>
                <div class="col-md-4">
                    <label class="form-label text-muted small fw-bold">Vai trò</label>
                    <select class="form-select" name="role">
                        <option value="">-- Tất cả vai trò --</option>
                        <option value="STUDENT" th:selected="${param.role != null and param.role.toString() == 'STUDENT'}">Học viên</option>
                        <option value="INSTRUCTOR" th:selected="${param.role != null and param.role.toString() == 'INSTRUCTOR'}">Giảng viên</option>
                        <option value="ADMIN" th:selected="${param.role != null and param.role.toString() == 'ADMIN'}">Quản trị viên</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i> Lọc dữ liệu</button>
                </div>
            </form>
        </div>

        <div class="bg-white shadow-sm rounded overflow-hidden">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="text-center" width="5%">ID</th>
                        <th class="text-center" width="10%">Avatar</th>
                        <th width="25%">Họ và Tên</th>
                        <th width="15%">Tài khoản</th>
                        <th class="text-center" width="15%">Vai trò</th>
                        <th class="text-center" width="10%">Trạng thái</th>
                        <th class="text-center" width="20%">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${users.isEmpty()}">
                        <td colspan="7" class="text-center text-muted py-4">Không tìm thấy người dùng nào!</td>
                    </tr>
                    <tr th:each="u : ${users}">
                        <td class="text-center fw-bold text-secondary" th:text="${u.id}"></td>

                        <td class="text-center">
                            <img th:if="${u.avatar != null and !u.avatar.isEmpty()}" th:src="${u.avatar}" 
                                 style="width: 45px; height: 45px; object-fit: cover;" class="rounded-circle border shadow-sm" alt="Avatar">
                            <i th:unless="${u.avatar != null and !u.avatar.isEmpty()}" class="bi bi-person-circle text-secondary fs-2"></i>
                        </td>

                        <td class="fw-bold" th:text="${(u.lastName != null ? u.lastName : '') + ' ' + (u.firstName != null ? u.firstName : '')}"></td>
                        <td class="text-muted" th:text="${u.username}"></td>

                        <td class="text-center">
                            <span class="badge bg-danger" th:if="${u.role == 'ADMIN'}">Admin</span>
                            <span class="badge bg-info text-dark" th:if="${u.role == 'STUDENT'}">Sinh viên</span>

                <th:block th:if="${u.role == 'INSTRUCTOR'}">
                    <span class="badge bg-success" th:if="${u.isInstructor}"><i class="bi bi-check-circle"></i> GV (Đã duyệt)</span>
                    <span class="badge bg-warning text-dark" th:unless="${u.isInstructor}"><i class="bi bi-hourglass-split"></i> Chờ duyệt</span>
                </th:block>
                </td>

                <td class="text-center">
                    <span class="badge bg-success" th:if="${u.isActive}">Active</span>
                    <span class="badge bg-secondary" th:unless="${u.isActive}">Locked</span>
                </td>

                <td class="text-center">
                <th:block th:if="${u.role == 'INSTRUCTOR' and !u.isInstructor}">
                    <button class="btn btn-sm btn-success me-1" title="Duyệt giảng viên"
                            th:onclick="'approveInstructor(\'' + @{/api/users/approve} + '\', ' + ${u.id} + ', this)'">
                        <i class="bi bi-check-circle"></i> Duyệt
                    </button>
                </th:block>

                <a th:href="@{/admin/users/{id}(id=${u.id})}" class="btn btn-sm btn-outline-info" title="Xem chi tiết & Cập nhật">
                    <i class="bi bi-pencil-square"></i> Sửa
                </a>
                </td>
                </tr>
                </tbody>
            </table>
        </div>

        <nav th:if="${totalPages > 1}" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/users(page=${currentPage - 1}, kw=${param.kw}, role=${param.role})}">« Trước</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/admin/users(page=${i}, kw=${param.kw}, role=${param.role})}" th:text="${i}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/users(page=${currentPage + 1}, kw=${param.kw}, role=${param.role})}">Sau »</a>
                </li>
            </ul>
        </nav>
    </section>

    <div th:replace="~{base :: footer}"></div>

    <script th:src="@{/js/script.js}"></script>
</body>
</html>
